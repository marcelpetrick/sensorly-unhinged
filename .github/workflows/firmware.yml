name: Firmware Bring-up

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Official espressif/idf:v5.5.4, immutable multi-platform image digest.
      image: espressif/idf@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compile the shared A/B bring-up image with pinned SDK
        shell: bash
        run: |
          source "${IDF_PATH}/export.sh"
          make firmware
      - name: Exercise the sensor wire decoder
        shell: bash
        run: make firmware-test
