name: Hardware Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-quality-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  local-pipeline:
    name: Local pipeline (KiCad 10)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/kicad/kicad@sha256:fdcfa0e8d41f640d16edfb28e027fe8862ab31af9e45dcacbc662cec5c916e4c
      options: --user root

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install mechanical tooling
        run: |
          apt-get update -qq
          apt-get install --no-install-recommends --yes openscad

      - name: Report pinned toolchain
        run: |
          python3 --version
          kicad-cli version
          openscad --version

      - name: Run complete development-quality gate
        run: ./localPipeline.sh

      - name: Upload draft review outputs and reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: draft-design-review-not-for-fabrication
          if-no-files-found: warn
          retention-days: 14
          path: |
            _build/erc.json
            _build/*/drc.json
            hardware/outputs/
            mechanical/*.stl
