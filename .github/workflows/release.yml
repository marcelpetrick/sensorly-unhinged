name: Hardware Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Board revision printed on the PCB, for example hw-a1 or hw-b1"
        required: true
        type: string
      publish_release:
        description: "Create the GitHub tag and release after every gate passes"
        required: true
        default: false
        type: boolean
      draft:
        description: "Create the GitHub Release as a draft"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hardware-release-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Qualify and package hardware
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/kicad/kicad@sha256:fdcfa0e8d41f640d16edfb28e027fe8862ab31af9e45dcacbc662cec5c916e4c
      options: --user root

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install mechanical tooling
        run: |
          apt-get update -qq
          apt-get install --no-install-recommends --yes openscad

      - name: Validate requested hardware revision
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          python3 -m tools.package_release --tag "${RELEASE_TAG}" --validate-only
          if [[ "${PUBLISH_RELEASE}" == "true" ]] \
            && git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            printf 'Tag %s already exists.\n' "${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Run complete development-quality gate
        run: ./localPipeline.sh

      - name: Run manufacturing gate and build release asset
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          make release-package RELEASE_TAG="${RELEASE_TAG}" \
            RELEASE_COMMIT="${GITHUB_SHA}"

      - name: Upload release asset set
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hardware-release-${{ inputs.tag }}
          path: _build/release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: hardware-release-${{ inputs.tag }}
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "${DRAFT}" == "true" ]]; then
            flags+=(--draft)
          fi
          if [[ "${PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          cat > release-notes.md <<EOF
          Hardware release ${RELEASE_TAG} for sensorly-unhinged.

          The archive contains the selected board's Gerbers, drill, placement,
          assembly drawing, STEP and enclosure meshes, plus the shared schematic,
          BOM, netlist, source design and qualification manifest. The SHA-256 file
          verifies the downloaded archive.
          EOF
          gh release create "${RELEASE_TAG}" \
            "release-assets/sensorly-unhinged-${RELEASE_TAG}.zip#Manufacturing and design package" \
            "release-assets/sensorly-unhinged-${RELEASE_TAG}.zip.sha256#SHA-256 checksum" \
            --target "${TARGET_SHA}" \
            --title "sensorly-unhinged ${RELEASE_TAG}" \
            --notes-file release-notes.md \
            "${flags[@]}"
